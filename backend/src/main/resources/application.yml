spring:
  application:
    name: predial-noticias-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predial_news}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  main:
    banner-mode: "off"

logging:
  level:
    com.zaxxer.hikari: WARN

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
